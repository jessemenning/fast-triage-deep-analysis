# feldera-solace sidecar config for the FAA Fast/Slow data plane.
#
# Replaces the in-SQL solace_input/solace_output connectors that the old custom
# Feldera fork carried. Each ingest bridge binds one fl-* queue (provisioned by
# stack/config/solace/setup.sh) and POSTs to the matching Feldera table; each
# egress bridge streams a MATERIALIZED view and publishes it to Solace.
#
# FL_SOLACE_HOSTNAME/PORT/VPN/USER/PASSWORD are read from the sidecar container's
# environment at startup (set in docker-compose.yml) and substituted into the
# dollar-brace references below; an unset variable is a startup error. Note: the
# expander scans the whole file, so do not write a dollar-brace token in a comment.
#
# Parity with the old connectors:
#   ingest  payload_mode: wrap  → raw body in column `payload`, topic captures +
#           solace_topic + broker_ts merged in as same-named JSON fields.
#   egress  payload_shape: envelope → {"insert":{...}} / {"delete":{...}} on the
#           wire, byte-for-byte what consumers (UI, API, SAM gateway, smoketest)
#           already parse. publish_deletes: skip == the old skip_deletes: true.

pipeline:
  url: http://feldera:8080/v0/pipelines/arrival-capacity
  wait_ready_timeout_secs: 300

health:
  port: 8079

# ── Ingest: Solace queue → Feldera table ─────────────────────────────────────
ingest:
  - table: faa_ingest_position_raw
    payload_mode: wrap
    solace:
      host: ${FL_SOLACE_HOSTNAME}
      port: ${FL_SOLACE_PORT}
      vpn: ${FL_SOLACE_VPN}
      username: ${FL_SOLACE_USER}
      password: ${FL_SOLACE_PASSWORD}
      queue: fl-fdps-position
      include_topic: true
      include_broker_timestamp: true
      topic_pattern: "FDPS/position/{flight_id}/{status}/{callsign}/{origin}/{destination}/{latitude}/{longitude}/{ground_speed}/{altitude_ft}/{heading}/{gufi}"

  - table: faa_ingest_flightplan_raw
    payload_mode: wrap
    solace:
      host: ${FL_SOLACE_HOSTNAME}
      port: ${FL_SOLACE_PORT}
      vpn: ${FL_SOLACE_VPN}
      username: ${FL_SOLACE_USER}
      password: ${FL_SOLACE_PASSWORD}
      queue: fl-fdps-flightplan
      include_topic: true
      include_broker_timestamp: true
      topic_pattern: "FDPS/flightPlan/{flight_id}/{status}/{departure}/{arrival}/{gufi}"

  - table: faa_ingest_eta_raw
    payload_mode: wrap
    solace:
      host: ${FL_SOLACE_HOSTNAME}
      port: ${FL_SOLACE_PORT}
      vpn: ${FL_SOLACE_VPN}
      username: ${FL_SOLACE_USER}
      password: ${FL_SOLACE_PASSWORD}
      queue: fl-ttp-eta
      include_topic: true
      include_broker_timestamp: true
      topic_pattern: "TTP/flightData/{gufi}/{arrival}/{eta_source}"

  - table: faa_ingest_rate_raw
    payload_mode: wrap
    solace:
      host: ${FL_SOLACE_HOSTNAME}
      port: ${FL_SOLACE_PORT}
      vpn: ${FL_SOLACE_VPN}
      username: ${FL_SOLACE_USER}
      password: ${FL_SOLACE_PASSWORD}
      queue: fl-ttp-rate
      include_topic: true
      include_broker_timestamp: true
      topic_pattern: "TTP/airportInfo/{airport}"

  - table: faa_ingest_tmr_raw
    payload_mode: wrap
    solace:
      host: ${FL_SOLACE_HOSTNAME}
      port: ${FL_SOLACE_PORT}
      vpn: ${FL_SOLACE_VPN}
      username: ${FL_SOLACE_USER}
      password: ${FL_SOLACE_PASSWORD}
      queue: fl-ttp-tmr
      include_topic: true
      include_broker_timestamp: true
      topic_pattern: "TTP/restriction/{airport}/{restriction_type}"

  # NOTE: METAR is NOT bridged here. It rides the nisshi Kafka on-ramp and Feldera
  # reads it with its native kafka_input connector (see faa_program.sql §1), so there
  # is no sidecar ingest and no fl-aviation-metar queue for weather.

  - table: faa_ingest_reset_raw
    payload_mode: wrap
    solace:
      host: ${FL_SOLACE_HOSTNAME}
      port: ${FL_SOLACE_PORT}
      vpn: ${FL_SOLACE_VPN}
      username: ${FL_SOLACE_USER}
      password: ${FL_SOLACE_PASSWORD}
      queue: fl-faa-reset
      include_topic: true
      include_broker_timestamp: true
      # static topic, no captures — include_topic/broker_ts still populate those columns
      topic_pattern: "faa/scenario/reset"

# ── Egress: Feldera view → Solace topic ──────────────────────────────────────
egress:
  # Per-bin breach storm (UI). skip deletes so a recovering bin is not republished.
  - view: fl_arrival_breach_sink
    payload_shape: envelope
    publish_deletes: skip
    solace:
      host: ${FL_SOLACE_HOSTNAME}
      port: ${FL_SOLACE_PORT}
      vpn: ${FL_SOLACE_VPN}
      username: ${FL_SOLACE_USER}
      password: ${FL_SOLACE_PASSWORD}
      topic: "fl/faa/arrival-capacity/breach/{airport}"
      delivery_mode: direct

  # One invariant incident row per airport — the SAM escalation trigger.
  - view: fl_arrival_incident_sink
    payload_shape: envelope
    publish_deletes: skip
    solace:
      host: ${FL_SOLACE_HOSTNAME}
      port: ${FL_SOLACE_PORT}
      vpn: ${FL_SOLACE_VPN}
      username: ${FL_SOLACE_USER}
      password: ${FL_SOLACE_PASSWORD}
      topic: "fl/faa/arrival-capacity/incident/{airport}"
      delivery_mode: direct

  # Observable SEVERE↔CLEAR state — deletes published so consumers get the all-clear.
  # send_snapshot so a reconnecting sidecar re-emits current state (UI green signal).
  - view: fl_arrival_incident_state_sink
    payload_shape: envelope
    publish_deletes: envelope
    send_snapshot: true
    solace:
      host: ${FL_SOLACE_HOSTNAME}
      port: ${FL_SOLACE_PORT}
      vpn: ${FL_SOLACE_VPN}
      username: ${FL_SOLACE_USER}
      password: ${FL_SOLACE_PASSWORD}
      topic: "fl/faa/arrival-capacity/incident-state/{airport}"
      delivery_mode: direct

  # Live per-bin demand for the dashboard — deletes included so a bin clears.
  - view: fl_arrival_demand_sink
    payload_shape: envelope
    publish_deletes: envelope
    solace:
      host: ${FL_SOLACE_HOSTNAME}
      port: ${FL_SOLACE_PORT}
      vpn: ${FL_SOLACE_VPN}
      username: ${FL_SOLACE_USER}
      password: ${FL_SOLACE_PASSWORD}
      topic: "fl/faa/arrival-capacity/demand/{airport}"
      delivery_mode: direct
