<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Continuum FAA Arrival Capacity — Live Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
:root {
  --dark-blue:    #03213B;
  --deep-blue:    #093B5F;
  --classic-green:#00C895;
  --bright-green: #ABFF88;
  --orange:       #FCA829;
  --red:          #FF4444;
  --sky-blue:     #C2F7FF;
  --muted-blue:   #7FA8C9;
  --text:         #E8F4FF;
  --text-muted:   #7FA8C9;
  --border:       rgba(0,200,149,0.18);
  --panel:        rgba(9,59,95,0.55);
  --font-body:    Figtree, 'Segoe UI', sans-serif;
  --font-mono:    'Space Mono', 'Cascadia Mono', monospace;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html,body { height: 100%; }
body {
  background: var(--dark-blue);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 13px;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* ── HEADER ──────────────────────────────────────────────────────────────── */
header {
  flex-shrink: 0;
  height: 48px;
  display: flex;
  align-items: center;
  padding: 0 20px;
  background: linear-gradient(135deg, #03213B 0%, #093B5F 100%);
  border-bottom: 1px solid var(--border);
  gap: 16px;
}
.brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.brand-mark {
  width: 28px; height: 28px;
  background: var(--classic-green);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
}
.brand-mark svg { width: 16px; height: 16px; }
.brand-title {
  font-family: var(--font-mono);
  font-size: 12px; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
}
.brand-sub { font-size: 10px; color: var(--text-muted); letter-spacing: 0.06em; font-family: var(--font-mono); }
.header-divider { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }
.header-stats { display: flex; gap: 24px; flex: 1; }
.hstat { display: flex; flex-direction: column; }
.hstat-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); }
.hstat-value { font-family: var(--font-mono); font-size: 16px; font-weight: 700; color: var(--sky-blue); line-height: 1.2; }
.hstat-value.orange { color: var(--orange); }
.hstat-value.green  { color: var(--classic-green); }
.nav-link {
  font-family: var(--font-mono); font-size: 11px;
  color: var(--classic-green); text-decoration: none;
  border: 1px solid rgba(0,200,149,0.35); padding: 4px 14px;
  border-radius: 4px; letter-spacing: 0.06em;
  white-space: nowrap; flex-shrink: 0;
  transition: background 0.15s;
}
.nav-link:hover { background: rgba(0,200,149,0.1); }

/* ── CANVAS STRIP ────────────────────────────────────────────────────────── */
.canvas-strip {
  flex: 1;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(3,33,59,0.95) 0%, rgba(9,59,95,0.4) 100%);
  position: relative;
  overflow: hidden;
}
.canvas-strip canvas { width: 100%; height: 100%; display: block; }

/* ── STATUS BAR ──────────────────────────────────────────────────────────── */
.status-bar {
  flex-shrink: 0; height: 28px;
  border-top: 1px solid var(--border);
  background: rgba(3,33,59,0.8);
  display: flex; align-items: center; padding: 0 16px; gap: 16px;
  font-family: var(--font-mono); font-size: 10px; color: var(--text-muted);
}
.conn-indicator { display: flex; align-items: center; gap: 5px; }
.conn-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.conn-dot.live         { background: var(--classic-green); animation: pulse-dot 1.5s infinite; }
.conn-dot.reconnecting { background: var(--orange); animation: pulse-dot 0.7s infinite; }
.conn-dot.stale        { background: var(--red); }
.status-sep { color: rgba(127,168,201,0.3); }
@keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.3} }
@keyframes pulse-opacity { 0%,100%{opacity:1} 50%{opacity:0.35} }

/* ── DETAIL SIDE PANEL ───────────────────────────────────────────────────── */
#detail-panel {
  position: fixed;
  right: 0; top: 48px; bottom: 28px;
  width: 300px;
  background: #03213B;
  border-left: 2px solid #00C895;
  z-index: 300;
  transform: translateX(100%);
  transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
  overflow-y: auto;
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: #C2F7FF;
  box-shadow: -4px 0 24px rgba(0,200,149,0.12);
}
#detail-panel.dp-open { transform: translateX(0); }
.dp-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px 6px;
  border-bottom: 1px solid rgba(0,200,149,0.3);
}
.dp-title { color: #00C895; font-size: 11px; letter-spacing: 0.08em; }
.dp-close {
  background: none; border: 1px solid #FCA829; color: #FCA829;
  cursor: pointer; font-size: 11px; padding: 2px 7px; border-radius: 3px;
  line-height: 1;
}
.dp-close:hover { background: rgba(252,168,41,0.15); }
.dp-timer-bar { height: 3px; background: rgba(0,200,149,0.2); overflow: hidden; }
#dp-timer-fill { height: 100%; width: 100%; background: #00C895; }
#dp-body { padding: 12px 14px; }
.dp-field { margin-bottom: 10px; }
.dp-label {
  color: #FCA829; font-size: 10px; letter-spacing: 0.1em;
  display: block; margin-bottom: 2px; text-transform: uppercase;
}
.dp-value { color: #C2F7FF; word-break: break-all; line-height: 1.5; }
.dp-badge {
  display: inline-block; padding: 2px 10px; border-radius: 3px;
  font-size: 10px; font-weight: bold; letter-spacing: 0.12em;
}
.dp-REVIEW  { background: #FCA829; color: #03213B; }
.dp-APPROVE { background: #00C895; color: #03213B; }
.dp-DECLINE { background: #e55555; color: #fff; }
.dp-section {
  color: #00C895; font-size: 9px; letter-spacing: 0.15em; font-weight: bold;
  margin: 12px 0 6px; border-bottom: 1px solid rgba(0,200,149,0.2); padding-bottom: 3px;
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 16 16" fill="none" stroke="#03213B" stroke-width="2" stroke-linecap="round">
        <circle cx="8" cy="8" r="5"/><path d="M8 3v5l3 2"/>
      </svg>
    </div>
    <div>
      <div class="brand-title">Continuum FAA Arrival Capacity</div>
      <div class="brand-sub">Live Monitor</div>
    </div>
  </div>
  <div class="header-divider"></div>
  <div class="header-stats">
    <div class="hstat"><span class="hstat-label">Breaches</span><span class="hstat-value orange" id="h-review">—</span></div>
    <div class="hstat"><span class="hstat-label">Events</span><span class="hstat-value" id="h-events">0</span></div>
  </div>
  <a href="./" class="nav-link">← Dashboard</a>
</header>

<div class="canvas-strip">
  <canvas id="flowCanvas"></canvas>
</div>

<div class="status-bar">
  <div class="conn-indicator">
    <div class="conn-dot stale" id="conn-dot"></div>
    <span id="conn-label">Connecting…</span>
  </div>
  <span class="status-sep">|</span>
  <span id="status-last">No events yet</span>
  <span class="status-sep">|</span>
  <span id="status-events">0 events</span>
</div>

<div id="detail-panel">
  <div class="dp-header">
    <span class="dp-title">BREACH DETAIL</span>
    <button class="dp-close" id="dp-close">✕</button>
  </div>
  <div class="dp-timer-bar"><div id="dp-timer-fill"></div></div>
  <div id="dp-body"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════════
const caseMap = new Map();
let   eventTotal = 0;
const STATE_DOTS = [];
const STATE_KEYS = ['AU-WA','AU-SA','AU-QLD','AU-NSW','AU-VIC'];
const STATE_ABBR = ['WA','SA','QLD','NSW','VIC'];

// ═══════════════════════════════════════════════════════════════════════════════
// ARCHITECTURE CANVAS
// ═══════════════════════════════════════════════════════════════════════════════
const canvas = document.getElementById('flowCanvas');
const ctx    = canvas.getContext('2d');
const PARTICLES = [];
const POOL = 200;

function resizeCanvas() {
  canvas.width  = canvas.offsetWidth  * devicePixelRatio;
  canvas.height = canvas.offsetHeight * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const TOP_FRACS   = [0.12, 0.50, 0.88];
const BOT_FRACS   = [0.19, 0.55, 0.87];
const TOP_LABELS  = ['ARRIVAL\nFEED', 'CONTINUUM', 'POSTGRES'];
const BOT_LABELS  = ['MANAGEMENT', 'MAP', 'LAKE'];
const TOP_WIDTHS  = [300, 294, 264];
const BOT_WIDTHS  = [312, 468, 180];
const TOP_SUBTEXT = ['', '', 'ref data'];
const BOT_PROTO   = ['SSE', 'MQTT-WS', 'ICEBERG'];

function W() { return canvas.width / devicePixelRatio; }
function H() { return canvas.height / devicePixelRatio; }
function topX(i) { return W() * TOP_FRACS[i]; }
function botX(i) { return W() * BOT_FRACS[i]; }
const TOP_Y = 0.28;
const BOT_Y = 0.73;
const NODE_H = 72;
const STATE_BOX_W = 108;
const STATE_BOX_H = 84;
const STATE_GAP   = 18;

const LANE_DEFS = [
  { x0f: ()=>topX(0), y0f: ()=>H()*TOP_Y, x1f: ()=>topX(1), y1f: ()=>H()*TOP_Y, colors: ['#00C895','#FF4444'], weights: [50, 50], laneRate: 1.0 },
  { x0f: ()=>topX(0), y0f: ()=>H()*TOP_Y, x1f: ()=>topX(1), y1f: ()=>H()*TOP_Y, colors: ['#FCA829'], laneRate: 0 },
  { x0f: ()=>topX(1), y0f: ()=>H()*TOP_Y, x1f: ()=>botX(0), y1f: ()=>H()*BOT_Y, colors: ['#FCA829'], laneRate: 0 },
  { x0f: ()=>topX(1), y0f: ()=>H()*TOP_Y, x1f: ()=>botX(1), y1f: ()=>H()*BOT_Y, colors: ['#FCA829'], laneRate: 0 },
  { x0f: ()=>topX(1), y0f: ()=>H()*TOP_Y, x1f: ()=>botX(2), y1f: ()=>H()*BOT_Y, colors: ['#FCA829'], laneRate: 0 },
];
const _LANE_RATE_TOTAL = LANE_DEFS.reduce((s,l)=>s+l.laneRate,0);
function pickLane() {
  const r = Math.random() * _LANE_RATE_TOTAL;
  let sum = 0;
  for (let i = 0; i < LANE_DEFS.length; i++) { sum += LANE_DEFS[i].laneRate; if (r < sum) return i; }
  return LANE_DEFS.length - 1;
}

const REVIEW_DOTS = [];
function spawnReviewDot(topic, payload) {
  REVIEW_DOTS.push({ x0: 0, y0: 0, x1: 0, y1: 0, x: 0, y: 0, t: 0, speed: 0.004, topic, payload, active: true });
}

const CONTINUUM_DOTS = [];
const _BOT_X = [()=>botX(0), ()=>botX(1), ()=>botX(2)];
function spawnContinuumDots(topic, payload) {
  for (const li of [2, 3, 4]) {
    CONTINUUM_DOTS.push({ li, x0: 0, y0: 0, x1: 0, y1: 0, x: 0, y: 0, t: 0, speed: 0.004, topic, payload, active: true });
  }
}

let mouseX = -999, mouseY = -999;

for (let i = 0; i < POOL; i++) PARTICLES.push(makePt(true));

const CDC_PTS = Array.from({length: 8}, (_, i) => ({
  t: i / 8, speed: 0.00025 + Math.random() * 0.00035,
  alpha: 0.28 + Math.random() * 0.22, size: 2.5, x: 0, y: 0, payload: null,
}));
const ACCOUNT_DATA = [];
fetch('/api/faa/rates').then(r => r.json()).then(data => {
  ACCOUNT_DATA.push(...data);
  CDC_PTS.forEach((p, i) => { p.payload = data[i % data.length] || null; });
}).catch(() => {});

function randFrom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function weightedRandFrom(colors, weights) {
  if (!weights) return randFrom(colors);
  const r = Math.random() * weights.reduce((a,b)=>a+b,0);
  let sum = 0;
  for (let i = 0; i < colors.length; i++) { sum += weights[i]; if (r < sum) return colors[i]; }
  return colors[colors.length-1];
}

function makePt(init) {
  const li = pickLane(), lane = LANE_DEFS[li];
  const x0 = lane.x0f(), y0 = lane.y0f(), x1 = lane.x1f(), y1 = lane.y1f();
  const t = init ? Math.random() : 0;
  return { li, x: x0+(x1-x0)*t, y: y0+(y1-y0)*t, x0, y0, x1, y1, t, speed: 0.003+Math.random()*0.006,
    color: weightedRandFrom(lane.colors, lane.weights), alpha: 0.5+Math.random()*0.5, size: 1.5+Math.random()*2, active: true };
}

function respawnPt(p) {
  const li = pickLane(), lane = LANE_DEFS[li];
  p.li = li; p.x0 = lane.x0f(); p.y0 = lane.y0f(); p.x1 = lane.x1f(); p.y1 = lane.y1f();
  p.t = 0; p.x = p.x0; p.y = p.y0; p.speed = 0.003+Math.random()*0.006;
  p.color = randFrom(lane.colors); p.alpha = 0.5+Math.random()*0.5; p.size = 1.5+Math.random()*2; p.active = true;
}

function drawArrow(x0,y0,x1,y1,color,dash,label) {
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = 1;
  ctx.setLineDash(dash || [4,6]); ctx.globalAlpha = 0.25;
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
  if (label) {
    ctx.globalAlpha = 0.55; ctx.setLineDash([]);
    ctx.fillStyle = color; ctx.font = '700 16px "Space Mono",monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, (x0+x1)/2-(y1-y0)*0.05, (y0+y1)/2+(x1-x0)*0.05);
  }
  ctx.restore();
}

function drawNode(x, y, label, w, subtext) {
  const bx = x-w/2, by = y-NODE_H/2;
  ctx.save();
  ctx.fillStyle = 'rgba(9,59,95,0.8)'; ctx.strokeStyle = 'rgba(0,200,149,0.55)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(bx, by, w, NODE_H, 3); ctx.fill(); ctx.stroke();
  const lines = label.split('\n');
  ctx.fillStyle = '#00C895'; ctx.font = '700 24px "Space Mono",monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (lines.length > 1) { ctx.fillText(lines[0], x, y-13); ctx.fillText(lines[1], x, y+13); }
  else ctx.fillText(label, x, y);
  if (subtext) {
    ctx.fillStyle = 'rgba(127,168,201,0.6)'; ctx.font = '400 18px "Space Mono",monospace';
    ctx.fillText(subtext, x, by+NODE_H+10);
  }
  ctx.restore();
}

function stateBoxX(i) {
  const totalW = STATE_KEYS.length * STATE_BOX_W + (STATE_KEYS.length-1) * STATE_GAP;
  return botX(1) - totalW/2 + i*(STATE_BOX_W+STATE_GAP) + STATE_BOX_W/2;
}

function spawnStateDot(region, color) {
  const i = STATE_KEYS.indexOf(region);
  if (i < 0) return;
  STATE_DOTS.push({ i, region: STATE_KEYS[i], color, x: 0, y: 0, t: 0, speed: 0.006, active: true });
}

function drawStateBuckets(by) {
  const totalW = STATE_KEYS.length * STATE_BOX_W + (STATE_KEYS.length-1) * STATE_GAP;
  const gLeft = botX(1) - totalW/2;
  STATE_KEYS.forEach((key, i) => {
    const bx = gLeft + i*(STATE_BOX_W+STATE_GAP), cx = bx+STATE_BOX_W/2, bby = by-STATE_BOX_H/2;
    ctx.save();
    ctx.fillStyle = 'rgba(9,59,95,0.85)'; ctx.strokeStyle = 'rgba(0,200,149,0.55)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(bx, bby, STATE_BOX_W, STATE_BOX_H, 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#00C895'; ctx.font = '700 28px "Space Mono",monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(STATE_ABBR[i], cx, by);
    ctx.restore();
  });
  ctx.save();
  ctx.fillStyle = 'rgba(127,168,201,0.6)'; ctx.font = '400 18px "Space Mono",monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('MQTT-WS', botX(1), by+STATE_BOX_H/2+6);
  ctx.restore();
}

function drawSolacePlatformBox(W_, H_) {
  const ty = H_*TOP_Y, by = H_*BOT_Y;
  const pad = 24;
  const bLeft  = topX(0)+TOP_WIDTHS[0]/2+pad;
  const bRight = topX(2)-TOP_WIDTHS[2]/2-pad;
  const bTop   = ty-NODE_H/2-44;
  const bBot   = (ty+by)/2+64;
  ctx.save();
  ctx.fillStyle = 'rgba(9,59,95,0.22)'; ctx.strokeStyle = 'rgba(0,200,149,0.35)';
  ctx.lineWidth = 1.5; ctx.setLineDash([10,7]);
  ctx.beginPath(); ctx.roundRect(bLeft, bTop, bRight-bLeft, bBot-bTop, 10); ctx.fill(); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(0,200,149,0.65)'; ctx.font = '700 15px "Space Mono",monospace';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText('SOLACE PLATFORM', bLeft+14, bTop+10);
  ctx.restore();
}

function animateCanvas() {
  const W_ = W(), H_ = H();
  ctx.clearRect(0, 0, W_, H_);
  const ty = H_*TOP_Y, by = H_*BOT_Y;

  drawSolacePlatformBox(W_, H_);

  drawArrow(topX(0)+TOP_WIDTHS[0]/2, ty, topX(1)-TOP_WIDTHS[1]/2, ty, '#00C895', [4,6], 'SMF');
  {
    const _fmx = (topX(0)+TOP_WIDTHS[0]/2 + topX(1)-TOP_WIDTHS[1]/2)/2;
    ctx.save();
    ctx.strokeStyle = 'rgba(0,200,149,0.55)'; ctx.lineWidth = 1.5;
    ctx.setLineDash([]); ctx.globalAlpha = 0.7;
    ctx.beginPath(); ctx.moveTo(_fmx, ty-10); ctx.lineTo(_fmx, ty+10); ctx.stroke();
    ctx.fillStyle = 'rgba(0,200,149,0.6)'; ctx.font = '400 11px "Space Mono",monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText('FILTER', _fmx, ty-12);
    ctx.restore();
  }
  drawArrow(topX(2)-TOP_WIDTHS[2]/2, ty+4, topX(1)+TOP_WIDTHS[1]/2, ty+4, 'rgba(255,255,255,0.45)', [3,7], 'CDC');
  drawArrow(topX(1), ty+NODE_H/2, botX(0), by-NODE_H/2,        '#FCA829', [3,5], 'SSE');
  drawArrow(topX(1), ty+NODE_H/2, botX(1), by-STATE_BOX_H/2,   '#FCA829', [3,5], 'MQTT');
  drawArrow(topX(1), ty+NODE_H/2, botX(2), by-NODE_H/2,        '#FCA829', [3,5], 'ICEBERG');

  for (const p of PARTICLES) {
    if (!p.active) continue;
    const ld = LANE_DEFS[p.li];
    p.x0 = ld.x0f(); p.y0 = ld.y0f(); p.x1 = ld.x1f(); p.y1 = ld.y1f();
    p.t += p.speed;
    if (p.t >= 1) { p.active = false; continue; }
    p.x = p.x0+(p.x1-p.x0)*p.t; p.y = p.y0+(p.y1-p.y0)*p.t;
    if (p.li === 0 && p.color !== '#FCA829' && p.t >= 0.5) continue;
    let _drawAlpha = p.alpha*(1-p.t*0.6);
    if (p.li === 0 && p.color !== '#FCA829' && p.t >= 0.4) _drawAlpha *= 1-(p.t-0.4)/0.1;
    ctx.save();
    ctx.globalAlpha = _drawAlpha;
    if (p.li === 2 || p.li === 4) {
      const _dx=p.x1-p.x0, _dy=p.y1-p.y0, _l=Math.sqrt(_dx*_dx+_dy*_dy)||1;
      const _px=-_dy/_l*4, _py=_dx/_l*4;
      ctx.shadowColor='#FCA829'; ctx.shadowBlur=10; ctx.fillStyle='#FCA829';
      ctx.beginPath(); ctx.arc(p.x+_px, p.y+_py, p.size, 0, Math.PI*2); ctx.fill();
      ctx.shadowColor='rgba(255,255,255,0.7)'; ctx.shadowBlur=7; ctx.fillStyle='#FFFFFF';
      ctx.beginPath(); ctx.arc(p.x-_px, p.y-_py, p.size, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.shadowColor=p.color; ctx.shadowBlur=7; ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  const inactive = PARTICLES.filter(p => !p.active);
  const rate = Math.ceil(inactive.length*0.02);
  for (let i = 0; i < rate && i < inactive.length; i++) respawnPt(inactive[i]);

  for (const p of CDC_PTS) {
    const prevT = p.t;
    p.t = (p.t+p.speed)%1;
    if (p.t < prevT && ACCOUNT_DATA.length) p.payload = ACCOUNT_DATA[Math.floor(Math.random()*ACCOUNT_DATA.length)];
    p.x = topX(2)+(topX(1)-topX(2))*p.t; p.y = H_*TOP_Y+5;
    const fade = p.t<0.1?p.t/0.1:p.t>0.9?(1-p.t)/0.1:1;
    ctx.save();
    ctx.globalAlpha=p.alpha*fade; ctx.shadowColor='rgba(255,255,255,0.7)'; ctx.shadowBlur=5; ctx.fillStyle='#FFFFFF';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  for (let i = REVIEW_DOTS.length-1; i >= 0; i--) {
    const d = REVIEW_DOTS[i];
    if (!d.active) { REVIEW_DOTS.splice(i,1); continue; }
    d.x0=topX(0)+TOP_WIDTHS[0]/2; d.y0=H_*TOP_Y; d.x1=topX(1)-TOP_WIDTHS[1]/2; d.y1=H_*TOP_Y;
    d.t+=d.speed;
    if (d.t>=1) { d.active=false; continue; }
    d.x=d.x0+(d.x1-d.x0)*d.t; d.y=d.y0+(d.y1-d.y0)*d.t;
    ctx.save();
    const _rdPre = d.t < 0.5;
    ctx.globalAlpha = _rdPre ? 0.55 : 1.0;
    ctx.shadowColor='#FCA829'; ctx.shadowBlur = _rdPre ? 7 : 14; ctx.fillStyle='#FCA829';
    ctx.beginPath(); ctx.arc(d.x, d.y, _rdPre ? 3 : 4, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  for (let i = CONTINUUM_DOTS.length-1; i >= 0; i--) {
    const d = CONTINUUM_DOTS[i];
    if (!d.active) { CONTINUUM_DOTS.splice(i,1); continue; }
    d.x0=topX(1); d.y0=H_*TOP_Y+NODE_H/2;
    d.x1=_BOT_X[d.li-2](); d.y1=H_*BOT_Y-(d.li===3?STATE_BOX_H/2:NODE_H/2);
    d.t+=d.speed;
    if (d.t>=1) { d.active=false; continue; }
    d.x=d.x0+(d.x1-d.x0)*d.t; d.y=d.y0+(d.y1-d.y0)*d.t;
    const _ldx=d.x1-d.x0, _ldy=d.y1-d.y0, _llen=Math.sqrt(_ldx*_ldx+_ldy*_ldy)||1;
    const _px=-_ldy/_llen*4, _py=_ldx/_llen*4;
    ctx.save();
    ctx.shadowColor='#FCA829'; ctx.shadowBlur=12; ctx.fillStyle='#FCA829';
    ctx.beginPath(); ctx.arc(d.x+_px, d.y+_py, 4, 0, Math.PI*2); ctx.fill();
    ctx.shadowColor='rgba(255,255,255,0.7)'; ctx.shadowBlur=8; ctx.fillStyle='#FFFFFF';
    ctx.beginPath(); ctx.arc(d.x-_px, d.y-_py, 4, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  {
    let _hovered = null, _isCdc = false;
    for (const d of [...REVIEW_DOTS, ...CONTINUUM_DOTS]) {
      if (!d.active) continue;
      const dx=d.x-mouseX, dy=d.y-mouseY;
      if (Math.sqrt(dx*dx+dy*dy) < 12) { _hovered=d; break; }
    }
    if (!_hovered) {
      for (const p of CDC_PTS) {
        if (!p.x || !p.payload) continue;
        const dx=p.x-mouseX, dy=p.y-mouseY;
        if (Math.sqrt(dx*dx+dy*dy) < 10) { _hovered=p; _isCdc=true; break; }
      }
    }
    if (_hovered) openDetailPanel(_hovered, _isCdc);
  }

  for (let i = STATE_DOTS.length-1; i >= 0; i--) {
    const d = STATE_DOTS[i];
    if (!d.active) { STATE_DOTS.splice(i,1); continue; }
    const x0=topX(1), y0=H_*TOP_Y+NODE_H/2, x1=stateBoxX(d.i), y1=H_*BOT_Y;
    d.t+=d.speed;
    if (d.t>=1) { d.active=false; continue; }
    d.x=x0+(x1-x0)*d.t; d.y=y0+(y1-y0)*d.t;
    const _sdx=x1-x0, _sdy=y1-y0, _sl=Math.sqrt(_sdx*_sdx+_sdy*_sdy)||1;
    const _spx=-_sdy/_sl*3, _spy=_sdx/_sl*3;
    ctx.save();
    ctx.shadowColor='#FCA829'; ctx.shadowBlur=12; ctx.fillStyle='#FCA829';
    ctx.beginPath(); ctx.arc(d.x+_spx, d.y+_spy, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.shadowColor='rgba(255,255,255,0.7)'; ctx.shadowBlur=8; ctx.fillStyle='#FFFFFF';
    ctx.beginPath(); ctx.arc(d.x-_spx, d.y-_spy, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    if (d.t > 0.1 && d.t < 0.9) {
      const _la = Math.min(1, Math.min((d.t - 0.1) / 0.1, (0.9 - d.t) / 0.15));
      ctx.save();
      ctx.globalAlpha = _la * 0.75;
      ctx.fillStyle = '#FCA829';
      ctx.font = '500 9px "Space Mono",monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('…/' + d.region + '/…', d.x - _spx * 6, d.y - _spy * 6 - 8);
      ctx.restore();
    }
  }

  TOP_LABELS.forEach((lbl, i) => drawNode(topX(i), ty, lbl, TOP_WIDTHS[i], TOP_SUBTEXT[i]));
  ctx.save();
  ctx.fillStyle='rgba(127,168,201,0.45)'; ctx.font='400 18px "Space Mono",monospace';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText('ref data  (non-transactional)', topX(2), ty+NODE_H/2+6);
  ctx.restore();
  BOT_LABELS.forEach((lbl, i) => {
    if (i===1) drawStateBuckets(by);
    else drawNode(botX(i), by, lbl, BOT_WIDTHS[i], BOT_PROTO[i]);
  });
  requestAnimationFrame(animateCanvas);
}
animateCanvas();

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouseX = e.clientX-r.left; mouseY = e.clientY-r.top;
});
canvas.addEventListener('mouseleave', () => { mouseX=-999; mouseY=-999; });

// Clicking a bottom node opens the dashboard in a new tab
canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX-rect.left, cy = e.clientY-rect.top;
  const H_ = H(), by = H_*BOT_Y;
  BOT_FRACS.forEach((f, i) => {
    const bx = W()*f, hw = BOT_WIDTHS[i]/2+24;
    if (cx>=bx-hw && cx<=bx+hw && cy>=by-NODE_H-12 && cy<=by+NODE_H+36) {
      window.open('./', '_blank');
    }
  });
});

// ═══════════════════════════════════════════════════════════════════════════════
// FORMATTERS
// ═══════════════════════════════════════════════════════════════════════════════
function fmtAmount(v) { return v != null ? '$'+Number(v).toFixed(2) : '—'; }
function fmtRegion(r) { return (r||'—'); }
function fmtTimestamp(iso) { return iso ? new Date(iso).toLocaleTimeString() : '—'; }
function fmtBin(a, b) { return (a || b) ? `${fmtTimestamp(a)} – ${fmtTimestamp(b)}` : '—'; }
function fmtScore(v, max) { return v != null ? `${v} / ${max}` : '—'; }
function fmtCodes(raw) {
  if (!raw) return '—';
  if (Array.isArray(raw)) return raw.join(', ');
  if (typeof raw === 'string' && raw.startsWith('['))
    try { return JSON.parse(raw).join(', '); } catch(e) {}
  return raw;
}

// ═══════════════════════════════════════════════════════════════════════════════
// DETAIL PANEL
// ═══════════════════════════════════════════════════════════════════════════════
let _dpTimer = null;
let _dpLastId = null;

function openDetailPanel(dot, isCdc) {
  const p = dot.payload || {};
  const id = isCdc ? p.airport : (p.airport ? p.airport + ':' + (p.bin_start || '') : null);
  const panel = document.getElementById('detail-panel');
  // Suppress re-open only while the panel is already visibly showing the same breach.
  if (id && id === _dpLastId && panel.classList.contains('dp-open')) return;
  _dpLastId = id;
  clearTimeout(_dpTimer);

  const body = document.getElementById('dp-body');
  const fill = document.getElementById('dp-timer-fill');

  function openPanel(durationMs) {
    panel.classList.add('dp-open');
    fill.style.transition = 'none';
    fill.style.width = '100%';
    requestAnimationFrame(() => {
      fill.style.transition = `width ${durationMs / 1000}s linear`;
      fill.style.width = '0%';
    });
    clearTimeout(_dpTimer);
    _dpTimer = setTimeout(() => {
      panel.classList.remove('dp-open');
      _dpLastId = null;
    }, durationMs);
  }

  if (isCdc) {
    body.innerHTML = buildCdcHtml(p);
    openPanel(10000);
  } else {
    body.innerHTML = buildTradeHtml(p, null);
    openPanel(10000);
    const snapId = id;
    fetch('/api/faa/breaches')
      .then(r => r.ok ? r.json() : null)
      .catch(() => null)
      .then(rows => {
        if (_dpLastId !== snapId) return;
        const ctx = Array.isArray(rows) ? rows.find(x => x.airport === p.airport) : null;
        body.innerHTML = buildTradeHtml(p, ctx, true);
        // If enrichment data arrived, re-open (or keep open) with a fresh 10s window.
        if (ctx) openPanel(10000);
      });
  }
}

function buildTradeHtml(p, ctx, fetched = false) {
  const c = ctx || {};
  const sev = c.severity || p.severity || '—';
  return `
    <div class="dp-field"><span class="dp-label">Severity</span>
      <span class="dp-value">${sev}</span></div>
    <div class="dp-field"><span class="dp-label">Airport</span>
      <span class="dp-value">${(c.airport||p.airport||'—')}${(c.airport_name||p.airport_name)?' · '+(c.airport_name||p.airport_name):''}</span></div>
    <div class="dp-field"><span class="dp-label">Bin Window</span>
      <span class="dp-value">${fmtBin(c.bin_start||p.bin_start, c.bin_end||p.bin_end)}</span></div>
    <div class="dp-field"><span class="dp-label">Demand / Capacity</span>
      <span class="dp-value">${(c.demand??p.demand??'—')} / ${(c.bin_capacity??p.bin_capacity??'—')}</span></div>
    <div class="dp-field"><span class="dp-label">Overage</span>
      <span class="dp-value">${(c.overage??p.overage??'—')}</span></div>

    <div class="dp-section">WEATHER</div>
    ${ctx ? `
    <div class="dp-field"><span class="dp-label">Condition</span>
      <span class="dp-value">${c.wx_condition||'—'}</span></div>
    <div class="dp-field"><span class="dp-label">Ceiling</span>
      <span class="dp-value">${c.wx_ceiling_ft!=null?c.wx_ceiling_ft+' ft':'—'}</span></div>
    <div class="dp-field"><span class="dp-label">Visibility</span>
      <span class="dp-value">${c.wx_visibility_mi!=null?c.wx_visibility_mi+' mi':'—'}</span></div>
    <div class="dp-field"><span class="dp-label">Wind</span>
      <span class="dp-value">${c.wx_wind_kt!=null?c.wx_wind_kt+' kt':'—'}</span></div>
    ` : fetched
      ? `<div class="dp-field"><span class="dp-value" style="color:#7FA8C9;font-size:10px">weather not available</span></div>`
      : `<div class="dp-field"><span class="dp-value" style="color:#7FA8C9;font-size:10px">loading…</span></div>`}

    <div class="dp-section">RESTRICTION</div>
    ${ctx ? `
    <div class="dp-field"><span class="dp-label">Type</span>
      <span class="dp-value">${c.active_restriction_type||'—'}</span></div>
    <div class="dp-field"><span class="dp-label">Reason</span>
      <span class="dp-value">${c.active_restriction_reason||'—'}</span></div>
    ` : ''}
  `;
}

function buildCdcHtml(p) {
  return `
    <div class="dp-field"><span class="dp-label">Type</span>
      <span class="dp-value"><span class="dp-badge" style="background:#C2F7FF;color:#03213B">RATES</span></span></div>
    <div class="dp-field"><span class="dp-label">Airport</span>
      <span class="dp-value">${p.airport||'—'}</span></div>
    <div class="dp-field"><span class="dp-label">Published AAR</span>
      <span class="dp-value">${p.aar??'—'}</span></div>
    <div class="dp-field"><span class="dp-label">ADR</span>
      <span class="dp-value">${p.adr??'—'}</span></div>
    <div class="dp-field"><span class="dp-label">Runway Config</span>
      <span class="dp-value">${p.runway_config||'—'}</span></div>
    <div class="dp-field"><span class="dp-label">Valid From</span>
      <span class="dp-value">${fmtTimestamp(p.valid_from)}</span></div>
    <div class="dp-field"><span class="dp-label">Valid To</span>
      <span class="dp-value">${fmtTimestamp(p.valid_to)}</span></div>
  `;
}

document.getElementById('dp-close').addEventListener('click', () => {
  clearTimeout(_dpTimer);
  _dpLastId = null;
  document.getElementById('detail-panel').classList.remove('dp-open');
});

// ═══════════════════════════════════════════════════════════════════════════════
// SSE CONNECTIONS
// ═══════════════════════════════════════════════════════════════════════════════
let sseOpen = 0;
function setSSEStatus(open) {
  sseOpen = open;
  const dot=document.getElementById('conn-dot'), lbl=document.getElementById('conn-label');
  if (open>=2)      { dot.className='conn-dot live'; lbl.textContent='SSE LIVE'; }
  else if (open>0)  { dot.className='conn-dot reconnecting'; lbl.textContent='SSE CONNECTING'; }
  else              { dot.className='conn-dot stale'; lbl.textContent='SSE DISCONNECTED'; }
}
setSSEStatus(0);

function onEvent() {
  eventTotal++;
  const now = new Date();
  document.getElementById('status-last').textContent   = 'Last: '+now.toLocaleTimeString();
  document.getElementById('status-events').textContent = eventTotal.toLocaleString()+' events';
  document.getElementById('h-events').textContent      = eventTotal.toLocaleString();
}

function openStream(path, eventName, handler) {
  const es = new EventSource(path);
  es.addEventListener('open',  () => { sseOpen++; setSSEStatus(sseOpen); });
  es.addEventListener(eventName, e => { onEvent(); try { handler(JSON.parse(e.data)); } catch {} });
  es.addEventListener('error', () => { sseOpen=Math.max(0,sseOpen-1); setSSEStatus(sseOpen); });
}

function updateReviewCount() {
  document.getElementById('h-review').textContent = caseMap.size;
}

fetch('/api/faa/breaches')
  .then(r => r.ok ? r.json() : [])
  .then(rows => {
    rows.forEach(data => { const k = data.airport ? data.airport+':'+(data.bin_start||'') : null; if (k) caseMap.set(k, {data}); });
    updateReviewCount();
  })
  .catch(() => {});

openStream('/api/faa/stream/breach', 'breach', data => {
  const id = data.airport ? data.airport+':'+(data.bin_start||'') : null; if (!id) return;
  // Pure upsert — accumulating view, rows are not auto-removed.
  spawnContinuumDots('fl/faa/arrival-capacity/breach/'+(data.airport||id), data);
  caseMap.set(id, {data});
  updateReviewCount();
});

openStream('/api/faa/stream/demand', 'demand', msg => {
  if (msg.topic) spawnReviewDot(msg.topic, msg.payload || {});
});
