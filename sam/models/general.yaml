kind: model
name: general
description: "Platform default 'general' model — OpenAI-compatible endpoint (LiteLLM proxy or direct). Fast/light slot used by the exposure decider and the two System-2 specialist agents."
spec:
  alias: general
  provider: "openai"
  modelName: "openai/${LLM_SERVICE_GENERAL_MODEL_NAME}"
  apiBase: "${LLM_SERVICE_ENDPOINT}"
  authConfig:
    apiKey: "${LLM_SERVICE_API_KEY}"
