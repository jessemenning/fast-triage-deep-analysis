[project]
name = "ep-mcp-http"
version = "0.1.0"
description = "Streamable-HTTP wrapper for the Solace Event Portal Designer MCP server (SAM connectors are mcp/remote only)."
requires-python = ">=3.11"
dependencies = [
    "solace-event-portal-designer-mcp==0.1.2",
    "fastmcp>=2.13,<3",
    "uvicorn>=0.30",
    "starlette>=0.40",
    "httpx>=0.27",
]

[project.scripts]
ep-mcp-http = "ep_mcp_http.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ep_mcp_http"]
